name: Publisher I8 em Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publisher-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publisher-docker:
    name: Contratos, publisher e Kafka real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: i8
    env:
      COMPOSE_PROJECT_NAME: ver1-i8-ci
      COMPOSE_FILE: validacao-local/compose.publisher.yml
      # Fix the A1 taxonomy version so changes elsewhere do not alter this proof.
      A1_REV: f4141bb43a2d13127cf2dcc380d991322be7ad35

    steps:
      - name: Baixar o I8 a ser testado
        uses: actions/checkout@v4
        with:
          path: i8
          persist-credentials: false

      - name: Baixar a taxonomia A1 da versão de referência
        uses: actions/checkout@v4
        with:
          repository: ods-26-2/a1
          ref: ${{ env.A1_REV }}
          path: a1
          persist-credentials: false

      - name: Preparar evidências e permissões Linux
        run: |
          mkdir -p validacao-local/evidencias
          echo "VER1_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "VER1_GID=$(id -g)" >> "$GITHUB_ENV"
          {
            echo "I8 testado: $(git rev-parse HEAD)"
            echo "A1 taxonomia: $(git -C ../a1 rev-parse HEAD)"
            echo "Eventos sintéticos; sem inferência real ou broker compartilhado."
            docker version
            docker compose version
          } > validacao-local/evidencias/ambiente.txt

      - name: Construir a imagem de testes
        run: docker compose build publisher-tests

      - name: Testar contratos, publisher e replay dentro do Docker
        run: |
          docker compose run --rm --no-deps publisher-tests \
            python -m pytest -q -p no:cacheprovider \
            tests/test_contracts_6c.py \
            tests/test_kafka_contract_1_1_candidate.py \
            tests/test_kafka_contract_2_0.py \
            tests/test_kafka_publisher.py \
            tests/test_replay_publication.py \
            --junitxml=/evidencias/unitarios.xml \
            2>&1 | tee validacao-local/evidencias/unitarios.log

      - name: Testar entrega e falha com Kafka real em Docker
        run: |
          docker compose run --rm publisher-tests \
            python -m pytest -q -p no:cacheprovider \
            tests/test_kafka_publisher_integration.py \
            --junitxml=/evidencias/integracao.xml \
            2>&1 | tee validacao-local/evidencias/integracao.log

      - name: Guardar diagnóstico se algum teste falhar
        if: failure()
        run: |
          docker compose logs --no-color --tail=200 > validacao-local/evidencias/containers.log 2>&1

      - name: Encerrar o laboratório Docker
        if: always()
        run: docker compose down -v

      - name: Publicar relatórios e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-publisher-i8
          path: i8/validacao-local/evidencias/
          if-no-files-found: warn
          retention-days: 30
